[project]
name = "mnc-finance-backend"
version = "0.1.0"
description = "Backend do MNC Finance Chatbot"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.10,<2.0",
    "fastapi[standard]>=0.115,<1.0",
    "openai>=2.0,<4.0",
    "openai-agents>=0.2,<1.0",
    "plotly>=6.0,<7.0",
    "pypdf>=5.0,<7.0",
    "yfinance>=0.2.50,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "mangum>=0.19,<1.0",
    "boto3>=1.35,<2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
